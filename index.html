<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Impressões & Cópias</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            width: 100%;
        }

        .logo {
            max-width: 400px;
            width: 90%;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: brightness(1.1);
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            max-width: 950px;
        }

        .form-section, .result-section {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 107, 0, 0.15);
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
            border: 1px solid rgba(255, 107, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        h1 i {
            color: #FF6B00;
            margin-right: 10px;
        }

        h2 {
            text-align: center;
            color: #cccccc;
            font-size: 1.1rem;
            margin: 12px 0;
            font-weight: 500;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 500;
            color: #cccccc;
            font-size: 0.9rem;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            margin: 8px 0 15px 0;
            border: 2px solid #333;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #0d0d0d;
            color: #fff;
        }

        input[type="number"]:focus {
            border-color: #FF6B00;
            outline: none;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.15);
        }

        input[type="number"]::placeholder {
            color: #555;
        }

        .button-group-material, .button-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button-group-material button, .button-group button {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 140px;
            background: #0d0d0d;
            color: #aaa;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .button-group-material button {
            height: 52px;
        }

        .button-group button {
            height: 48px;
        }

        .button-group-material button.active {
            background: #FF6B00;
            color: #fff;
            border-color: #FF6B00;
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.3);
        }

        .button-group-material button.active::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.15),
                transparent
            );
            animation: shine 1.5s infinite;
        }

        .button-group-material button:hover:not(.active) {
            border-color: #FF6B00;
            color: #fff;
            transform: scale(1.02);
        }

        .button-group button.active {
            background: #FF6B00;
            color: #fff;
            border-color: #FF6B00;
            box-shadow: 0 0 20px rgba(255, 107, 0, 0.2);
        }

        .button-group button:not(.active) {
            background: #0d0d0d;
            color: #aaa;
            border-color: #333;
        }

        .button-group button:not(.active):hover {
            border-color: #FF6B00;
            color: #fff;
        }

        button.calculate-btn {
            background: linear-gradient(135deg, #FF6B00, #E85D00);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        button.calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.4);
        }

        .result {
            margin-top: 15px;
            padding: 20px;
            background: #0d0d0d;
            border-radius: 14px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: #cccccc;
            border: 1px solid #333;
        }

        .result p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .result p:last-child {
            border-bottom: none;
        }

        .result p strong {
            color: #fff;
        }

        .result p span {
            color: #FF6B00;
            font-weight: 600;
        }

        .destaque-total {
            font-size: 2rem;
            font-weight: bold;
            color: #FF6B00;
            padding: 10px 20px;
            border-radius: 12px;
            margin-top: 5px;
            display: inline-block;
            background: rgba(255, 107, 0, 0.08);
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        .emoji {
            font-size: 1.2rem;
        }

        .observacoes {
            margin-top: 15px;
            padding: 15px 20px;
            background: #0d0d0d;
            border-radius: 14px;
            border: 1px solid #333;
            color: #aaa;
            font-size: 0.85rem;
        }

        .observacoes strong {
            color: #fff;
            display: block;
            margin-bottom: 8px;
        }

        .observacoes ul {
            list-style: none;
            padding: 0;
        }

        .observacoes ul li {
            padding: 4px 0;
            padding-left: 20px;
            position: relative;
        }

        .observacoes ul li::before {
            content: '•';
            color: #FF6B00;
            position: absolute;
            left: 0;
        }

        /* Admin Panel Styles */
        #adminPanel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            z-index: 1000;
            max-width: 92%;
            max-height: 88vh;
            overflow-y: auto;
            width: 100%;
            border: 1px solid rgba(255, 107, 0, 0.15);
        }

        #adminPanel::-webkit-scrollbar {
            width: 6px;
        }

        #adminPanel::-webkit-scrollbar-track {
            background: #0d0d0d;
            border-radius: 10px;
        }

        #adminPanel::-webkit-scrollbar-thumb {
            background: #FF6B00;
            border-radius: 10px;
        }

        #adminPanel h2 {
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        #adminPanel h2 i {
            color: #FF6B00;
            margin-right: 10px;
        }

        .price-category {
            margin-bottom: 15px;
            padding: 15px;
            background: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .price-category h3 {
            color: #FF6B00;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 600;
        }

        .price-range {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .price-range label {
            margin: 0;
            min-width: 120px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .price-range span {
            color: #fff;
            font-weight: 500;
        }

        .price-range input {
            width: 80px;
            padding: 6px 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .price-range input:focus {
            border-color: #FF6B00;
            outline: none;
        }

        #adminBtn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #FF6B00, #E85D00);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 25px rgba(255, 107, 0, 0.4);
            z-index: 999;
            transition: all 0.3s ease;
        }

        #adminBtn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 35px rgba(255, 107, 0, 0.5);
        }

        #adminBtn i {
            font-size: 1.4rem;
        }

        #adminOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 998;
        }

        .admin-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .admin-actions button {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        #savePricesBtn {
            background: linear-gradient(135deg, #FF6B00, #E85D00);
            color: white;
        }

        #savePricesBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.3);
        }

        #closeAdminBtn {
            background: #333;
            color: #fff;
        }

        #closeAdminBtn:hover {
            background: #444;
        }

        .admin-settings {
            margin-top: 15px;
            padding: 15px;
            background: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .admin-settings h3 {
            color: #FF6B00;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .setting-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .setting-item label {
            min-width: 180px;
            margin: 0;
            font-size: 0.85rem;
            color: #aaa;
        }

        .setting-item input {
            width: 80px;
            padding: 6px 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .setting-item input:focus {
            border-color: #FF6B00;
            outline: none;
        }

        .button-management {
            margin-bottom: 15px;
            padding: 15px;
            background: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
        }

        .button-management h3 {
            color: #FF6B00;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
        }

        .add-button-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .add-button-form input[type="text"] {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 0.85rem;
        }

        .add-button-form input[type="text"]:focus {
            border-color: #FF6B00;
            outline: none;
        }

        .add-button-form button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF6B00, #E85D00);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .add-button-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.3);
        }

        .button-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .button-list::-webkit-scrollbar {
            width: 4px;
        }

        .button-list::-webkit-scrollbar-track {
            background: #0a0a0a;
            border-radius: 10px;
        }

        .button-list::-webkit-scrollbar-thumb {
            background: #FF6B00;
            border-radius: 10px;
        }

        .button-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-bottom: 1px solid #2a2a2a;
            cursor: move;
            color: #ccc;
        }

        .button-item.dragging {
            opacity: 0.4;
            background: #2a2a2a;
        }

        .button-item:hover {
            background: #1a1a1a;
        }

        .button-item span {
            font-size: 0.9rem;
        }

        .button-item button {
            padding: 5px 14px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .button-item button:hover {
            background: #E85D00;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shine {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        #btnCopiar {
            margin-top: 12px;
            background: linear-gradient(135deg, #FF6B00, #E85D00);
        }

        #btnCopiar:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 0, 0.3);
        }

        /* Mobile-specific styles */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                flex-direction: column;
                gap: 15px;
            }

            .form-section, .result-section {
                padding: 18px;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.4rem;
            }

            h2 {
                font-size: 1rem;
            }

            label {
                font-size: 0.8rem;
            }

            input[type="number"], input[type="text"] {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            .button-group-material button, .button-group button {
                min-width: 100%;
                padding: 10px;
                font-size: 0.78rem;
                height: 42px;
            }

            button.calculate-btn {
                padding: 12px;
                font-size: 0.85rem;
            }

            .result {
                font-size: 0.8rem;
                padding: 14px;
            }

            .destaque-total {
                font-size: 1.4rem;
            }

            .emoji {
                font-size: 1rem;
            }

            #adminPanel {
                width: 96%;
                padding: 18px;
                max-height: 92vh;
                top: 0;
                left: 0;
                transform: none;
                border-radius: 0;
                max-width: 100%;
            }

            #adminPanel h2 {
                font-size: 1.2rem;
            }

            .price-category h3, .admin-settings h3, .button-management h3 {
                font-size: 0.95rem;
            }

            .price-range label, .setting-item label {
                min-width: 100%;
                margin-bottom: 4px;
            }

            .price-range input, .setting-item input {
                width: 100%;
                margin: 4px 0;
            }

            .admin-actions button {
                padding: 10px 20px;
                font-size: 0.85rem;
                flex: 1;
            }

            .add-button-form input[type="text"] {
                min-width: 100%;
            }

            .add-button-form button {
                width: 100%;
                padding: 10px;
            }

            #adminBtn {
                width: 50px;
                height: 50px;
                bottom: 15px;
                right: 15px;
            }

            #adminBtn i {
                font-size: 1.2rem;
            }

            .logo {
                max-width: 280px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                max-width: 220px;
            }

            h1 {
                font-size: 1.2rem;
            }

            h2 {
                font-size: 0.85rem;
            }

            .button-group-material button, .button-group button {
                font-size: 0.7rem;
                padding: 8px;
                height: 38px;
                min-width: 100%;
            }

            button.calculate-btn {
                font-size: 0.8rem;
                padding: 10px;
            }

            .result {
                font-size: 0.75rem;
            }

            .destaque-total {
                font-size: 1.2rem;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <div id="adminOverlay"></div>
    <div id="adminPanel">
        <h2><i class="fas fa-cog"></i> Painel de Administração</h2>
        
        <div class="button-management">
            <h3><i class="fas fa-tags"></i> Gerenciar Tipos de Impressão</h3>
            <div class="add-button-form">
                <input type="text" id="newButtonName" placeholder="Nome do novo tipo (ex: Impressão Especial)">
                <button onclick="addNewButtonType()"><i class="fas fa-plus"></i> Adicionar</button>
            </div>
            <div class="button-list" id="buttonList"></div>
        </div>
        
        <div id="priceEditor"></div>
        
        <div class="admin-settings">
            <h3><i class="fas fa-sliders-h"></i> Configurações Gerais</h3>
            <div class="setting-item">
                <label>Desconto Frente e Verso (%):</label>
                <input type="number" id="frenteVersoDiscount" min="0" max="100" step="1">
            </div>
            <div class="setting-item">
                <label>Taxa Frente/Verso Papéis Especiais (R$):</label>
                <input type="number" id="papelEspecialFrenteVerso" min="0" step="0.01" value="2.00">
            </div>
            <h3 style="margin-top: 15px;"><i class="fas fa-book"></i> Preços de Encadernação</h3>
            <div class="setting-item">
                <label>Até 20 folhas:</label>
                <input type="number" id="encad20" min="0" step="0.01">
            </div>
            <div class="setting-item">
                <label>21-50 folhas:</label>
                <input type="number" id="encad50" min="0" step="0.01">
            </div>
            <div class="setting-item">
                <label>51-100 folhas:</label>
                <input type="number" id="encad100" min="0" step="0.01">
            </div>
            <div class="setting-item">
                <label>101-200 folhas:</label>
                <input type="number" id="encad200" min="0" step="0.01">
            </div>
            <div class="setting-item">
                <label>201-300 folhas:</label>
                <input type="number" id="encad300" min="0" step="0.01">
            </div>
            <div class="setting-item">
                <label>301-400 folhas:</label>
                <input type="number" id="encad400" min="0" step="0.01">
            </div>
        </div>
        
        <div class="admin-actions">
            <button id="savePricesBtn" onclick="savePrices()"><i class="fas fa-save"></i> Salvar</button>
            <button id="closeAdminBtn" onclick="hideAdminPanel()"><i class="fas fa-times"></i> Fechar</button>
        </div>
    </div>

    <button id="adminBtn" onclick="showAdminPanel()" title="Painel de Administração">
        <i class="fas fa-cog"></i>
    </button>

    <header>
        <img src="logohorizontal.png" alt="Logo da Empresa" class="logo">
    </header>
    <div class="container">
        <div class="form-section">
            <h1><i class="fas fa-print"></i> Impressões / Cópias</h1>
            <label for="quantidade"><i class="fas fa-sort-numeric-up"></i> Quantidade:</label>
            <input type="number" id="quantidade" min="1" placeholder="Digite a quantidade">

            <label><i class="fas fa-file-alt"></i> Tipo de impressão:</label>
            <div class="button-group-material" id="buttonGroupMaterial"></div>

            <h2><i class="fas fa-cog"></i> Outras informações:</h2>
            <div class="button-group">
                <button id="frenteVersoBtn" onclick="toggleFrenteVerso()"><i class="fas fa-arrows-alt-h"></i> Frente e Verso</button>
                <button id="encadernacaoBtn" onclick="toggleEncadernacao()"><i class="fas fa-book"></i> Encadernação</button>
            </div>

            <button class="calculate-btn" onclick="atualizarTotal()"><i class="fas fa-calculator"></i> Calcular</button>
        </div>

        <div class="result-section">
            <h1><i class="fas fa-chart-line"></i> Resultado</h1>
            <div class="result" id="resultado" style="display: none;">
                <p><strong><i class="fas fa-sort-numeric-up"></i> Quantidade:</strong> <span id="resultadoQuantidade"></span></p>
                <p><strong><i class="fas fa-file-alt"></i> Tipo:</strong> <span id="resultadoTipo"></span></p>
                <p><strong><i class="fas fa-arrows-alt-h"></i> Frente e Verso:</strong> <span id="resultadoFrenteVerso"></span></p>
                <p><strong><i class="fas fa-book"></i> Encadernação:</strong> <span id="resultadoEncadernacao"></span></p>
                <p><strong><i class="fas fa-dollar-sign"></i> Valor por Impressão:</strong> <span id="resultadoValorUnitario"></span></p>
                <p><strong><i class="fas fa-coins"></i> Total:</strong> <span id="resultadoTotal"></span></p>
            </div>

            <div class="observacoes" id="observacoes" style="display: none;">
                <strong><i class="fas fa-info-circle"></i> Observações:</strong>
                <ul id="observacoesLista"></ul>
            </div>

            <button id="btnCopiar" class="calculate-btn" onclick="copiarOrcamento()" style="display: none;"><i class="fas fa-copy"></i> Copiar Orçamento</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123";
        const DEFAULT_PRICES = {
            a4_preto_branco: [

        function savePrices() {
            const categories = document.querySelectorAll('.price-category');
            categories.forEach(category => {
                const type = category.getAttribute('data-type');
                const inputs = category.querySelectorAll('input[type="number"]');
                currentPrices[type] = [];
                inputs.forEach((input, index) => {
                    let max;
                    if (index < inputs.length - 1) {
                        max = parseInt(input.getAttribute('data-max')) || 
                              (currentPrices[type] && currentPrices[type][index] ? currentPrices[type][index].max : 200);
                    } else {
                        max = Infinity;
                    }
                    currentPrices[type].push({
                        max: max,
                        price: parseFloat(input.value) || 0
                    });
                });
            });

            currentSettings.frenteVersoDiscount = parseFloat(document.getElementById('frenteVersoDiscount').value) || 0;

        function setupDragAndDrop() {
            const buttonList = document.getElementById('buttonList');
            const items = buttonList.querySelectorAll('.button-item');

            items.forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    item.classList.add('dragging');
                    e.dataTransfer.setData('text/plain', item.getAttribute('data-type'));
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedType = e.dataTransfer.getData('text/plain');
                    const targetType = item.getAttribute('data-type');
                    
                    if (draggedType !== targetType) {
                        const newOrder = Object.keys(currentPrices).filter(type => type !== draggedType);
                        const targetIndex = newOrder.indexOf(targetType);
                        newOrder.splice(targetIndex, 0, draggedType);
                        
                        const newPrices = {};
                        newOrder.forEach(type => {
                            newPrices[type] = currentPrices[type];
                        });
                        currentPrices = newPrices;
                        
                        localStorage.setItem('printPrices', JSON.stringify(currentPrices));
                        loadButtonList();
                        renderButtonGroup();
                    }
                });

                // Touch support for drag-and-drop
                let touchStartY = 0;
                item.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                    item.classList.add('dragging');
                    e.target.setAttribute('data-dragging', 'true');
                });

                item.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    if (target && target.classList.contains('button-item') && target !== item) {
                        target.style.background = '#2a2a2a';
                    }
                });

                item.addEventListener('touchend', (e) => {
                    item.classList.remove('dragging');
                    const touch = e.changedTouches[0];
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    item.removeAttribute('data-dragging');
                    if (target && target.classList.contains('button-item') && target !== item) {
                        target.style.background = '';
                        const draggedType = item.getAttribute('data-type');
                        const targetType = target.getAttribute('data-type');
                        if (draggedType !== targetType) {
                            const newOrder = Object.keys(currentPrices).filter(type => type !== draggedType);
                            const targetIndex = newOrder.indexOf(targetType);
                            newOrder.splice(targetIndex, 0, draggedType);
                            const newPrices = {};
                            newOrder.forEach(type => {
                                newPrices[type] = currentPrices[type];
                            });
                            currentPrices = newPrices;
                            localStorage.setItem('printPrices', JSON.stringify(currentPrices));
                            loadButtonList();
                            renderButtonGroup();
                        }
                    }
                });
            });
        }

            tipoSelecionado = tipo;

        function isPapelEspecial(tipo) {
            return PAPEIS_ESPECIAIS.includes(tipo);
        }

        function calcularPreco(qtd, type) {
            if (!currentPrices[type]) return 0;
            
            const ranges = [...currentPrices[type]].sort((a, b) => a.max - b.max);
            
            for (const range of ranges) {
                if (qtd <= range.max || range.max === Infinity) {
                    return range.price;
                }
            }
            
            if (ranges.length > 0) {
                return ranges[ranges.length - 1].price;
            }
            
            return 0;
        }

        function calcularEncadernacao(folhas) {
            if (folhas <= 20) return currentSettings.encadernacao.encad20;
            if (folhas <= 50) return currentSettings.encadernacao.encad50;
            if (folhas <= 100) return currentSettings.encadernacao.encad100;
            if (folhas <= 200) return currentSettings.encadernacao.encad200;
            if (folhas <= 300) return currentSettings.encadernacao.encad300;
            if (folhas <= 400) return currentSettings.encadernacao.encad400;
            return 0;
        }

        function atualizarTotal() {
            const quantidadeInput = document.getElementById('quantidade');
            let quantidade = Number(quantidadeInput.value);
            
            if (isNaN(quantidade) || quantidade < 1) {
                alert('⚠️ A quantidade mínima de impressões/cópias é 1.');
                quantidadeInput.value = 1;
                quantidade = 1;
            }
            
            if (quantidade > 9999999) {
                alert('⚠️ Quantidade muito grande. Por favor, entre em contato para orçamentos com mais de 10 milhões de páginas.');
                quantidadeInput.value = 10000000;
                quantidade = 10000000;
            }
            
            if (frenteVersoAtivo && quantidade < 2) {
                alert('⚠️ Ao selecionar Frente e Verso, a quantidade mínima é 2.');
                quantidadeInput.value = 2;
                quantidade = 2;
            }
            
            let folhas = frenteVersoAtivo ? Math.ceil(quantidade / 2) : quantidade;
            let valorUnitario = tipoSelecionado ? calcularPreco(quantidade, tipoSelecionado) : 0;
            
            // Para digitalização: primeira = 1.00, seguintes = 0.50
            let totalImpressao = 0;
            if (tipoSelecionado === 'digitalizacao_scanner') {
                if (quantidade === 1) {
                    totalImpressao = 1.00;
                } else if (quantidade >= 2) {
                    totalImpressao = 1.00 + (quantidade - 1) * 0.50;
                }
                valorUnitario = totalImpressao / quantidade;
            } else {
                totalImpressao = valorUnitario * quantidade;
                
                // Verifica se é papel especial (sem desconto de 8%)
                if (frenteVersoAtivo && isPapelEspecial(tipoSelecionado)) {
                    // Papéis especiais: adiciona R$2.00 por página (folha) no frente e verso
                    const taxaFrenteVerso = currentSettings.papelEspecialFrenteVerso || 2.00;
                    totalImpressao += taxaFrenteVerso * folhas;
                } else if (frenteVersoAtivo) {
                    // Demais tipos: aplica desconto de 10%
                    const discount = currentSettings.frenteVersoDiscount / 100;
                    totalImpressao *= (1 - discount);
                }
            }
            
            let custoEncadernacao = 0;
            if (encadernacaoAtivo && tipoSelecionado !== 'digitalizacao_scanner') {
                custoEncadernacao = calcularEncadernacao(folhas);
            }
            
            const total = totalImpressao + custoEncadernacao;
            
            const displayNames = {
                'a4_preto_branco': 'A4 Preto e Branco',
                'a4_colorido_pigmentada': 'A4 Colorido Pigmentada',
                'a4_colorido_laser': 'A4 Colorido Laser',
                'a3_colorido': 'A3 Colorido',
                'papel_couche_250g': 'Papel Couchê 250g',
                'papel_cartao_240g': 'Papel Cartão 240g',
                'papel_couche_115g': 'Papel Couchê 115g',
                'papel_cartao_180g': 'Papel Cartão 180g',
                'digitalizacao_scanner': 'Digitalização (Scanner)'
            };
            
            document.getElementById('resultadoQuantidade').innerText = quantidade;
            document.getElementById('resultadoTipo').innerText = tipoSelecionado ? 
                (displayNames[tipoSelecionado] || document.querySelector(`.button-group-material button.active`)?.innerText || 'Não selecionado') : 'Não selecionado';
            document.getElementById('resultadoFrenteVerso').innerText = frenteVersoAtivo ? 'Sim' : 'Não';
            document.getElementById('resultadoEncadernacao').innerText = encadernacaoAtivo ? 'Sim' : 'Não';
            document.getElementById('resultadoValorUnitario').innerText = tipoSelecionado ? `R$ ${valorUnitario.toFixed(2)}` : 'R$ 0.00';
            document.getElementById('resultadoTotal').innerHTML = tipoSelecionado ? 
                `<span class="destaque-total"><span class="emoji">✅</span> R$ ${total.toFixed(2)} <span class="emoji">✅</span></span>` : 
                `<span class="destaque-total"><span class="emoji">⚠️</span> Selecione um tipo <span class="emoji">⚠️</span></span>`;
            
            document.getElementById('resultado').style.display = 'block';
            document.getElementById('observacoes').style.display = 'block';
            document.getElementById('btnCopiar').style.display = tipoSelecionado ? 'block' : 'none';
            
            if (tipoSelecionado) {
                atualizarObservacoes(tipoSelecionado);
            } else {
                document.getElementById('observacoesLista').innerHTML = '';
            }
        }

        function copiarOrcamento() {
            if (!tipoSelecionado) {
                alert('⚠️ Selecione um tipo de impressão antes de copiar o orçamento.');
                return;
            }
            const quantidade = document.getElementById('resultadoQuantidade').innerText;
            const tipo = document.getElementById('resultadoTipo').innerText;
            const frenteVerso = document.getElementById('resultadoFrenteVerso').innerText;
            const encadernacao = document.getElementById('resultadoEncadernacao').innerText;
            const valorUnitario = document.getElementById('resultadoValorUnitario').innerText;
            const total = document.getElementById('resultadoTotal').innerText.replace(/[✅⚠️]/g, '').trim();
            const observacoes = document.getElementById('observacoes').innerText.replace(/Observações:/, '').trim();
            const textoCompleto = `📄 ORÇAMENTO - Impressões & Cópias\n━━━━━━━━━━━━━━━━━━━━━━━━━\n\n📌 Quantidade: ${quantidade}\n📌 Tipo: ${tipo}\n📌 Frente e Verso: ${frenteVerso}\n📌 Encadernação: ${encadernacao}\n📌 Valor por Impressão: ${valorUnitario}\n\n💰 TOTAL: ${total}\n\n📋 Observações:\n${observacoes}\n━━━━━━━━━━━━━━━━━━━━━━━━━`;
            navigator.clipboard.writeText(textoCompleto)
                .then(() => {
                    alert('✅ Orçamento copiado para a área de transferência!');
                })
                .catch(() => {
                    alert('❌ Erro ao copiar o orçamento.');
                });
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                atualizarTotal();
            }
        });
    </script>
</body>
</html>
